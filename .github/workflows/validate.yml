name: validate

on:
  push:
  pull_request:

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: idea-to-blueprint
      - uses: astral-sh/setup-uv@v10
      - name: Validate SKILL.md against the Agent Skills spec
        run: uvx --from "git+https://github.com/agentskills/agentskills#subdirectory=skills-ref" skills-ref validate idea-to-blueprint
      - name: Linter still runs
        run: python3 idea-to-blueprint/scripts/lint_blueprint.py --help
